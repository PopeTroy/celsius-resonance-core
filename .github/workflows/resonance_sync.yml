name: Celsius resonance sync

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Apex Engine
        env:
          NIM_LLM_URL: ${{ secrets.NIM_LLM_URL || 'http://localhost:8000/v1/chat/completions' }}
          NIM_LLM_MODEL: "deepseek-ai/deepseek-v4"
          DEEPSEEK_ENABLE_THINKING: "true"
          DEEPSEEK_REASONING_EFFORT: "high"
        run: |
          python scripts/apex_engine.py

      - name: Configure Git Bot
        run: |
          git config --global user.name "UESP-Bot"
          git config --global user.email "bot@celsiusmediagroup.co.za"

      - name: Commit and Push Updated Assets
        run: |
          # Check for modified or untracked files
          if [ -n "$(git status --porcelain)" ]; then
            echo "[*] Changes detected. Committing assets..."
            git add -A
            git commit -m "Auto-update via UESP-Bot [skip ci]"
            git push origin main
          else
            echo "[*] Working tree clean. Nothing to commit."
          fi
